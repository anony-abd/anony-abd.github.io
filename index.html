<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300&family=Raleway:wght@100;200;300&family=Montserrat:wght@100;200;300&family=Nunito:wght@200;300&family=Lato:wght@100;300&family=Inter:wght@100;200;300&family=Josefin+Sans:wght@100;200;300&family=Quicksand:wght@300&family=Comfortaa:wght@300&family=Outfit:wght@100;200;300&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/422f9f51d2.js" crossorigin="anonymous"></script>
    <title>Mathgabs</title>
    <link rel="icon" type="image/png" href="images/mathgabs_icon.png" id="gabs_icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="title">
        <img id="gabs_icon" src="images/mathgabs_icon.png" height="79px" width="80px" alt="mathgabs_icon"> 
        <h1 id="webname">Mathgabs</h1>
        <div class="search-wrapper">
            <input type="text" class="search-bar" placeholder="Search">
            <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
    </header>
    <script type="importmap">
    {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/",
          "three/examples/jsm/controls/OrbitControls": "https://cdn.jsdelivr.net/npm/three@0.132.2/examples/jsm/controls/OrbitControls.js"
        }
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Solve.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Extra.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@13.2.0/lib/browser/math.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
